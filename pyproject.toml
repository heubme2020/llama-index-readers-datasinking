[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "llama-index-readers-datasinking"
version = "0.1.0"
description = "LlamaIndex Reader for DataSinking — full-text financial reports as documents"
authors = ["DataSinking <support@datasink.ing>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "llama_index" }]

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
llama-index-core = "^0.10.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
mypy = "0.991"
